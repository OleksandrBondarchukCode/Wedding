<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запрошення на весілля</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: sans-serif;
          color: #333;
          line-height: 1.6;
          overflow-x: hidden;
          scroll-behavior: smooth;
        }

        .section {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          opacity: 0;
          transform: translateY(40px);
          transition: opacity 1s ease, transform 1s ease;
          padding: 2rem 1rem;
        }

        .section.visible {
          opacity: 1;
          transform: translateY(0);
        }

        h1, h2 {
          margin-bottom: 0.5rem;
        }

        .button {
          display: inline-block;
          margin-top: 1rem;
          padding: 0.8rem 1.2rem;
          background-color: #444;
          color: #fff;
          text-decoration: none;
          border-radius: 8px;
          transition: background-color 0.3s ease;
        }

        .button:hover {
          background-color: #222;
        }


        .section-1 {
          background: url('Section-1.jpg') no-repeat center center/cover;
          color: #fff;
        }

        .section-2 {
          background-color: #f5deb3;
          }
          .oval-photo {
  width: 150px;
  height: 200px;
  object-fit: cover; /* щоб фото не спотворювалось */
  border-radius: 50% / 60%; /* робить форму овальною */
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.section-3 {
background-color: #f5deb3;
}

.event-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
  margin-top: 1.5rem;
}

/* Ефект плавної появи знизу */
.fade-line {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 1.2s ease forwards;
  animation-delay: var(--delay);
  font-size: 1.2rem;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.tree {
  position: relative;
  width: 200px;
  height: 400px;
  margin: 2rem auto;
}

.main-branch {
  position: absolute;
  left: 50%;
  top: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(to bottom, #f5deb3, #c49e6c);
  transform: translateX(-50%);
  border-radius: 3px;
}

.tree {
  position: relative;
  width: 200px;
  height: 400px;
  margin: 2rem auto;
}

.main-branch {
  position: absolute;
  left: 50%;
  top: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(to bottom, #f5deb3, #c49e6c);
  transform: translateX(-50%);
  border-radius: 3px;
}

/* Декоративні рисочки-гілочки */
.twig {
  position: absolute;
  left: 50%;
  width: 60px;       /* довжина гілки */
  height: 2px;       /* товщина гілки */
  background-color: #c29e6c;
  transform-origin: left center;
  border-radius: 24px;
}


/* Гілки ліворуч */
.small-branch.left {
  position: absolute;
  left: 50%;
  width: 150px;
  transform: translateX(-140%) rotate(0deg);
}

/* Гілки праворуч */
.small-branch.right {
  position: absolute;
  left: 50%;
  width: 150px;
  transform: rotate(0deg);
}

<body>

<header class="section section-1">
    <h1>Ми одружуємось</h1>
    <p>Олена & Константин</p>

</header>

<section class="section section-2">
    <h2>Про подію</h2>
    <p> Будемо щасливі бачити вас поруч у день, коли два серця стануть одним 💖 <br>
     Розділіть з нами нашу радість 🌸</p>
    <img src="Section-4.jpg" alt="Ми разом" class="oval-photo">
</section>

<section class="section section-3">
    <h2>Де і коли</h2>

    <div class="tree">
        <div class="main-branch"></div>
        <div class="twig"></div>

        <div class="small-branch left" style="top:10%;">
            <p>💒 Вінчання — 13:30</p>
        </div>
        <div class="small-branch right" style="top:25%;">

        </div>
        <div class="small-branch left" style="top:40%;">
            <p>м. Бровари, вул. Героїв України, 22А</p>
        </div>
        <div class="small-branch right" style="top:60%;">
            <p>🍷 Банкет — 15:00</p>
        </div>
        <div class="small-branch left" style="top:75%;">
            <p>Ресторан «Петрівський Бровар»</p>
        </div>
    </div>

</section>



<section class="section section-4">
    <h2>З любов'ю</h2>
</section>




<script>
    const sections = document.querySelectorAll('.section');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });
    sections.forEach(section => observer.observe(section));
</script>

</body>
