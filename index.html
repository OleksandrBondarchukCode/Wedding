<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запрошення на весілля</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: sans-serif;
          color: #333;
          line-height: 1.6;
          overflow-x: hidden;
          scroll-behavior: smooth;
        }

        .section {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          opacity: 0;
          transform: translateY(40px);
          transition: opacity 1s ease, transform 1s ease;
          padding: 2rem 1rem;
        }

        .section.visible {
          opacity: 1;
          transform: translateY(0);
        }

        h1, h2 {
          margin-bottom: 0.5rem;
        }

        .button {
          display: inline-block;
          margin-top: 1rem;
          padding: 0.8rem 1.2rem;
          background-color: #444;
          color: #fff;
          text-decoration: none;
          border-radius: 8px;
          transition: background-color 0.3s ease;
        }

        .button:hover {
          background-color: #222;
        }


        .section-1 {
          background: url('Section-1.jpg') no-repeat center center/cover;
          color: #fff;
        }

        .section-2 {
          background-color: #f5deb3;
        }

        .section-3 {
                    background: url('flowers-bg.jpg') no-repeat center center/cover;
        }
.oval-photo {
  width: 300px;
  height: 400px;
  object-fit: cover; /* щоб фото не спотворювалось */
  border-radius: 50% / 60%; /* робить форму овальною */
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.section-4 {
  background: url('Section-5.jpg') no-repeat center center/cover;
  color: #fff;
}




    </style>
</head>
<body>

<header class="section section-1">
    <h1>Ми одружуємось</h1>
    <p>Олена & Константин</p>

</header>

<section class="section section-2">
    <h2>Про подію</h2>
    <p>Ніжні слова, коротка історія кохання.</p>
</section>

<section class="section section-3">
    <h2>Де і коли</h2>
    <p>Місце проведення, дата, час.</p>
    <img src="Section-4.jpg" alt="Ми разом" class="oval-photo">
</section>

<section class="section section-4">
    <h2>З любов'ю</h2>
</section>




<script>
    const sections = document.querySelectorAll('.section');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });
    sections.forEach(section => observer.observe(section));
</script>

</body>
</html>
